version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        patterns: ["*"]
    ignore:
      # typescript-eslint 8.x declares a peer range of typescript <6.1.0, so a
      # TypeScript major bump makes `npm ci` fail with ERESOLVE. Drop this entry
      # once typescript-eslint supports the newer major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
