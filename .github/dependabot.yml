version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        patterns: ["*"]
    ignore:
      # typescript-eslint 8.x declares a peer range of typescript <6.1.0, so a
      # TypeScript major bump makes `npm ci` fail with ERESOLVE. Drop this entry
      # once typescript-eslint supports the newer major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/vscode is pinned to engines.vscode on purpose: vsce refuses to
      # package when it is the higher of the two, and letting it float would
      # compile against APIs that the oldest supported editor does not have.
      # Raise engines.vscode first, then this, together and by hand.
      - dependency-name: "@types/vscode"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
