name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # Download a stable VS Code build instead of looking for a local Antigravity IDE.
      URIGREP_TEST_TARGET: vscode
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint and compile
        run: npm run pretest

      # The tests start a real editor, which needs a display on Linux.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: npm test

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the .vsix
        run: npx --no-install vsce package --out uri-grep.vsix

      - uses: actions/upload-artifact@v7
        with:
          name: uri-grep-vsix
          path: uri-grep.vsix
          if-no-files-found: error
